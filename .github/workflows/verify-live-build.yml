name: Manual Live image build verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-inspect:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Debian Live builder and verifier tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends \
            bash ca-certificates dosfstools grub-efi-amd64-bin grub-pc-bin \
            live-build mtools rsync squashfs-tools syslinux-common \
            syslinux-utils xorriso
      - name: Build the experimental ISO
        run: ./build.sh
      - name: Verify checksums and packaged boot/credential files
        run: |
          set -euo pipefail
          checksum_file="$(find dist -maxdepth 1 -type f -name 'nacar-linux_*.sha256' -print -quit)"
          inventory="$(find dist -maxdepth 1 -type f -name 'nacar-linux_*.packages.tsv' -print -quit)"
          iso="$(find dist -maxdepth 1 -type f -name 'nacar-linux_*.iso' -print -quit)"
          test -n "$checksum_file" -a -n "$inventory" -a -n "$iso"
          (cd dist && sha256sum --check "$(basename "$checksum_file")")
          bash tests/verify_live_image.sh "$iso" "$inventory"
      - name: Summarize release gate
        run: |
          printf '%s\n' 'This manual job does not publish or upload the ISO.'
          printf '%s\n' 'A successful build is not a boot test; RELEASE_STATUS must remain blocked until QEMU gates pass.'
