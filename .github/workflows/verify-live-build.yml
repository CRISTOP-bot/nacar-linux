name: Build and inspect Nácar ISO (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and inspect in an isolated Debian Trixie container
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env GITHUB_SHA --env GITHUB_REF_NAME \
            debian:trixie-slim \
            bash scripts/build_in_container.sh
      - name: Verify output checksums and summarize limits
        run: |
          set -euo pipefail
          test -s dist/nacar.iso
          (cd dist && sha256sum --check nacar.sha256)
          printf '%s\n' 'Nácar ISO built and inspected; this public workflow does not upload or retain the ISO.'
          printf '%s\n' 'The runner discards its workspace at job end; this does not boot-test the image.'
          printf '%s\n' 'RELEASE_STATUS remains blocked.'
