name: Build and inspect Nácar ISO (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and inspect in an isolated Debian Trixie container
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env GITHUB_SHA --env GITHUB_REF_NAME \
            debian:trixie-slim \
            bash scripts/build_in_container.sh
      - name: Upload private preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nacar-iso-${{ github.sha }}
          path: |
            dist/nacar.iso
            dist/nacar.packages.tsv
            dist/nacar.build-info.txt
            dist/nacar.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Summarize verification limits
        run: |
          printf '%s\n' 'The ISO is available only as a private, temporary workflow artifact.'
          printf '%s\n' 'This build does not boot-test the image; RELEASE_STATUS remains blocked.'
