name: Build and publish release ISO
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enforce release gates
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(cat RELEASE_STATUS)" = release-ready || { echo 'Release blocked: complete documented release gates first.' >&2; exit 1; }
          test "${RELEASE_TAG#v}" = "$(cat VERSION)" || { echo 'Release tag does not match VERSION.' >&2; exit 1; }
      - name: Build and inspect in an isolated Debian Trixie container
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env GITHUB_SHA --env GITHUB_REF_NAME \
            debian:trixie-slim \
            bash scripts/build_in_container.sh
      - name: Create the GitHub Release after successful build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/nacar.iso \
            dist/nacar.packages.tsv \
            dist/nacar.build-info.txt \
            dist/nacar.sha256 \
            --title "$RELEASE_TAG" --generate-notes
