name: Validate repository
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell syntax
        run: bash -n build.sh scripts/build_in_container.sh && sh -n auto/config tests/verify_live_image.sh config/includes.chroot/usr/lib/live/config-hooks/9999-nacar-live-credentials
      - name: Run repository and policy tests
        run: python3 -m unittest discover -s tests -v
