name: Bug report
description: Report a reproducible defect in the build or system.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include exact error output, with secrets and personal data removed.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Git revision / release
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and reproduction steps
      description: Include Debian suite, architecture, build tool versions, and exact commands.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked that this is not a duplicate.
          required: true
        - label: I removed credentials and sensitive data from the report.
          required: true
